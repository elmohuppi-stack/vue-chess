services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vue-chess-web
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
